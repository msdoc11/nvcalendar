name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: |
          echo "node $(node --version) / npm $(npm --version)"
          if ! npm ci --no-audit --no-fund > install.log 2>&1; then
            message=$(grep -iE "npm (error|warn ERESOLVE)" install.log | tail -n 20 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            [ -z "$message" ] && message=$(tail -n 20 install.log | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=npm ci failed on Node ${{ matrix.node }} with npm $(npm --version)::$message"
            exit 1
          fi

      - run: npm run lint
      - run: npm run test
      - run: npm run build
