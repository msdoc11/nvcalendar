name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Nuxt 4 itself requires ^22.19 || ^24.11 || >=26, so there is nothing
        # to verify on Node 20.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Node 22 ships npm 10, which builds a different dependency tree from the
      # one in the lockfile and rejects it as out of sync.
      - run: npm install -g npm@11

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
