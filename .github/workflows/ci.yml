name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: |
          npm install --no-audit --no-fund 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### npm install failed on Node ${{ matrix.node }}"
              echo '```'
              tail -n 120 install.log
              echo '```'
              echo '### npm debug log'
              echo '```'
              tail -n 120 ~/.npm/_logs/*.log 2>/dev/null || echo "no debug log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - run: npm run lint
      - run: npm run test
      - run: npm run build
